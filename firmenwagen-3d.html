<style>
:root{--bg:#e6e6e3;--ink:#141414;--muted:#5a5a5a;--btn:#fff;--line:#cfcfcb;--on:#141414;--onink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--ink:#f0f0f0;--muted:#a6a6a6;--btn:#2a2a2a;--line:#3c3c3c;--on:#f0f0f0;--onink:#141414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1b;--ink:#f0f0f0;--muted:#a6a6a6;--btn:#2a2a2a;--line:#3c3c3c;--on:#f0f0f0;--onink:#141414;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;gap:8px;justify-content:center;padding:10px 16px 0;flex-wrap:wrap}
#view{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#view:active{cursor:grabbing}
#view canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#flat{display:none;flex:1;min-height:0;overflow:auto;padding:8px 16px}
#flat canvas{display:block;width:1200px;max-width:none;height:auto;border-radius:12px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 16px 18px}
.bar p{width:100%;text-align:center;margin:0 0 2px;color:var(--muted);font-size:13px}
button{font:inherit;font-size:14px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.act{background:var(--on);color:var(--onink);border-color:var(--on)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {HorizontalBlurShader} from 'three/addons/shaders/HorizontalBlurShader.js';
import {VerticalBlurShader} from 'three/addons/shaders/VerticalBlurShader.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

const PHONE='+49 721 555 01 23', WEB='www.tmnxt.de', MAIL='info@tmnxt.de';
const $=id=>document.getElementById(id);
let scheme='white';
const SCH={white:{body:0xf3f4f5,ink:'#0e0e0f',shade:'#e2e3e6',bodyCss:'#eef0f1',bump:0x1a1b1d,metal:0,rough:.28,flake:false},
           anth:{body:0x33373c,ink:'#f4f4f4',shade:'#4a4f55',bodyCss:'#2c2f33',bump:0x121315,metal:.55,rough:.36,flake:true}};

// ---------- Maße (m) ----------
// x = Länge (Front +), y = Höhe, z = Breite. Opel Vivaro L (Länge 5,31 m, Radstand 3,28 m) als Annahme.
const XR=-2.69, XF=2.62, XMIN=XR, XMAX=XF, HW=0.96;
const WHEELS=[-1.575,1.70], WR=0.343, WY=0.343, AR=0.43, TRZ=0.83, SILL=0.31;
const OPS=[['M',XR,0.31],['L',XR,1.76],['Q',XR,1.90,XR+0.14,1.90],['L',0.62,1.90],['Q',0.88,1.90,1.02,1.75],['L',1.60,1.13],['L',2.40,0.985],['Q',2.62,0.95,2.62,0.78],['L',2.62,0.31],['Z']];
const CABWIN=[[0.45,1.735],[0.94,1.735],[1.44,1.20],[0.45,1.20]];
const DEC={sideCx:-1.15,sideW:2.75,sideH:1.0,sideCy:1.33,rearW:1.5,rearH:1.2,rearCy:1.30,hoodW:0.80,hoodL:0.44};

// ---------- Dekor-Zeichnung ----------
const MARK=[[[-86,8],[-6,87],[-6,8]],[[96,1],[41,1],[4,38],[4,94]],[[6,-89],[6,-9],[86,-9]],[[-4,-93],[-96,-1],[-41,-1],[-4,-38]]];
function mark(g,cx,cy,s,col){g.fillStyle=col;MARK.forEach(p=>{g.beginPath();p.forEach((q,i)=>{const x=cx+q[0]*s,y=cy+q[1]*s;i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();g.fill();});}
function icon(g,t,cx,cy,s,col){
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=s*0.1;g.lineCap='round';g.lineJoin='round';
  const h=s/2;
  if(t==='ig'){g.beginPath();g.moveTo(cx-h+s*.25,cy-h);g.lineTo(cx+h-s*.25,cy-h);g.quadraticCurveTo(cx+h,cy-h,cx+h,cy-h+s*.25);g.lineTo(cx+h,cy+h-s*.25);g.quadraticCurveTo(cx+h,cy+h,cx+h-s*.25,cy+h);g.lineTo(cx-h+s*.25,cy+h);g.quadraticCurveTo(cx-h,cy+h,cx-h,cy+h-s*.25);g.lineTo(cx-h,cy-h+s*.25);g.quadraticCurveTo(cx-h,cy-h,cx-h+s*.25,cy-h);g.closePath();g.stroke();g.beginPath();g.arc(cx,cy,s*.24,0,Math.PI*2);g.stroke();g.beginPath();g.arc(cx+s*.3,cy-s*.3,s*.045,0,Math.PI*2);g.fill();}
  else if(t==='fb'){g.beginPath();g.arc(cx,cy,h,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(cx+s*.1,cy+h);g.lineTo(cx+s*.1,cy-s*.05);g.moveTo(cx-s*.08,cy-s*.05);g.lineTo(cx+s*.3,cy-s*.05);g.moveTo(cx+s*.1,cy-s*.05);g.quadraticCurveTo(cx+s*.1,cy-s*.3,cx+s*.32,cy-s*.3);g.stroke();}
  else if(t==='tt'){g.beginPath();g.moveTo(cx+s*.05,cy-h);g.lineTo(cx+s*.05,cy+s*.2);g.stroke();g.beginPath();g.arc(cx-s*.12,cy+s*.22,s*.17,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(cx+s*.05,cy-h);g.quadraticCurveTo(cx+s*.1,cy-s*.25,cx+s*.4,cy-s*.22);g.stroke();}
  else{g.beginPath();g.moveTo(cx-h+s*.2,cy-s*.32);g.lineTo(cx+h-s*.2,cy-s*.32);g.quadraticCurveTo(cx+h,cy-s*.32,cx+h,cy-s*.12);g.lineTo(cx+h,cy+s*.12);g.quadraticCurveTo(cx+h,cy+s*.32,cx+h-s*.2,cy+s*.32);g.lineTo(cx-h+s*.2,cy+s*.32);g.quadraticCurveTo(cx-h,cy+s*.32,cx-h,cy+s*.12);g.lineTo(cx-h,cy-s*.12);g.quadraticCurveTo(cx-h,cy-s*.32,cx-h+s*.2,cy-s*.32);g.closePath();g.stroke();g.beginPath();g.moveTo(cx-s*.08,cy-s*.14);g.lineTo(cx+s*.16,cy);g.lineTo(cx-s*.08,cy+s*.14);g.closePath();g.fill();}
}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const sideC=mk(1400,509),rearC=mk(750,600),hoodC=mk(600,330),gfxC=mk(800,1000);
function word(g,txt,x,y,px,col){g.font=px+"px 'Michroma','Arial Black',sans-serif";g.fillStyle=col;g.strokeStyle=col;g.lineWidth=px*0.045;g.lineJoin='round';g.fillText(txt,x,y);g.strokeText(txt,x,y);}
function drawSide(){const g=sideC.getContext('2d');const col=SCH[scheme].ink;g.clearRect(0,0,1400,509);
  g.textBaseline='alphabetic';g.textAlign='left';
  mark(g,270,150,1.0,col);
  word(g,'THERMONEXT',395,190,80,col);
  g.textAlign='right';g.fillStyle=col;g.font="400 38px 'Outfit',Arial,sans-serif";g.fillText('Gebäudetechnik GmbH',1222,243);
  g.textAlign='center';g.font="400 40px 'Outfit',Arial,sans-serif";g.fillText('Heizung   ·   Sanitär   ·   Klima',745,345);}
function drawGfx(){const g=gfxC.getContext('2d');g.clearRect(0,0,800,1000);mark(g,60,520,5.2,SCH[scheme].shade);}
function glyph(g,t,cx,cy,s,col){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=s*0.11;g.lineCap='round';g.lineJoin='round';const h=s/2;
  if(t==='mail'){g.strokeRect(cx-h,cy-h*0.7,s,s*0.7);g.beginPath();g.moveTo(cx-h,cy-h*0.7);g.lineTo(cx,cy);g.lineTo(cx+h,cy-h*0.7);g.stroke();}
  else if(t==='web'){g.beginPath();g.arc(cx,cy,h,0,7);g.stroke();g.beginPath();g.ellipse(cx,cy,h*0.45,h,0,0,7);g.stroke();g.beginPath();g.moveTo(cx-h,cy);g.lineTo(cx+h,cy);g.stroke();}
  else{g.beginPath();g.moveTo(cx-h*0.7,cy-h);g.lineTo(cx-h*0.25,cy-h);g.lineTo(cx-h*0.05,cy-h*0.45);g.lineTo(cx-h*0.35,cy-h*0.2);g.quadraticCurveTo(cx-h*0.1,cy+h*0.35,cx+h*0.25,cy+h*0.45);g.lineTo(cx+h*0.5,cy+h*0.15);g.lineTo(cx+h,cy+h*0.4);g.lineTo(cx+h,cy+h*0.85);g.quadraticCurveTo(cx-h*1.1,cy+h,cx-h*0.7,cy-h);g.closePath();g.fill();}}
function drawRear(){const g=rearC.getContext('2d');const col=SCH[scheme].ink;g.clearRect(0,0,750,600);
  g.textBaseline='alphabetic';mark(g,150,105,0.62,col);
  g.textAlign='left';word(g,'THERMONEXT',225,122,46,col);
  g.textAlign='right';g.fillStyle=col;g.font="400 22px 'Outfit',Arial,sans-serif";g.fillText('Gebäudetechnik GmbH',693,157);
  g.textAlign='left';g.font="400 24px 'Outfit',Arial,sans-serif";
  [['mail',MAIL],['web',WEB],['tel',PHONE]].forEach(([t,v],i)=>{const y=255+i*46;glyph(g,t,104,y-8,22,col);g.fillStyle=col;g.fillText(v,134,y);});
  ['ig','fb','tt','yt'].forEach((t,i)=>icon(g,t,104+i*46,412,24,col));}
function drawHood(){const g=hoodC.getContext('2d');const col=SCH[scheme].ink;g.clearRect(0,0,600,330);mark(g,300,120,0.95,col);g.textAlign='center';g.textBaseline='alphabetic';word(g,'THERMONEXT',300,292,46,col);}
function drawAll(){drawSide();drawRear();drawHood();drawGfx();}
drawAll();

// ---------- Karosserie-Geometrie (analytisch) ----------
const ss=(a,b,v)=>{let t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
function pathPts(ops,n){const out=[];let cx=0,cy=0;
  ops.forEach(o=>{if(o[0]==='M'){cx=o[1];cy=o[2];out.push([cx,cy]);}
    else if(o[0]==='L'){for(let i=1;i<=n;i++){const t=i/n;out.push([cx+(o[1]-cx)*t,cy+(o[2]-cy)*t]);}cx=o[1];cy=o[2];}
    else if(o[0]==='Q'){for(let i=1;i<=n*6;i++){const t=i/(n*6),a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;out.push([a*cx+b*o[1]+c*o[3],a*cy+b*o[2]+c*o[4]]);}cx=o[3];cy=o[4];}});
  return out;}
const TOP=pathPts(OPS.slice(1,8).map((o,i)=>i===0?['M',o[1],o[2]]:o),40);
function yt(x){let lo=0,hi=TOP.length-1;if(x<=TOP[0][0])return TOP[0][1];if(x>=TOP[hi][0])return TOP[hi][1];
  while(hi-lo>1){const m=(lo+hi)>>1;if(TOP[m][0]<=x)lo=m;else hi=m;}
  const a=TOP[lo],b=TOP[hi],d=b[0]-a[0];return d<1e-9?b[1]:a[1]+(b[1]-a[1])*(x-a[0])/d;}
function yb(x){let y=SILL+0.05*ss(2.35,2.62,x)+0.03*ss(-2.45,-2.69,x);for(const w of WHEELS){const d=x-w;if(Math.abs(d)<AR)y=Math.max(y,WY+Math.sqrt(AR*AR-d*d));}return y;}
function hw(x){const RF=0.24,RR=0.09;let w=HW;
  if(x>XF-RF){const d=Math.min(RF,x-(XF-RF));w=HW-RF+Math.sqrt(Math.max(0,RF*RF-d*d));}
  if(x<XR+RR){const d=Math.min(RR,(XR+RR)-x);w=HW-RR+Math.sqrt(Math.max(0,RR*RR-d*d));}
  return w;}
function inset(x,y){ // Einzug gegenüber der Grundbreite: Bauch, Schulterkante, Einzug Glashaus, schmalere Haube
  let d=0.024*Math.pow((Math.min(y,1.08)-0.80)/0.5,2);
  d+=0.007*ss(1.08,1.115,y)+0.02*Math.max(0,y-1.08);
  const t=Math.max(0,y-1.24);d+=0.10*t*t/(t+0.10);
  d+=0.07*ss(1.9,2.62,x)*ss(0.70,1.05,y);
  return d;}
function rtB(x){if(x<0.6)return 0.14;if(x<1.6)return 0.14-0.035*ss(0.6,1.6,x);return 0.105-0.025*ss(2.3,2.62,x);}
function crown(x,z,cz){const a=0.012+0.016*ss(1.6,1.85,x)*(1-ss(2.35,2.62,x));const q=cz>1e-4?z/cz:0;return a*(1-q*q);}
function sec(x){const b=yb(x),t=yt(x),w=hw(x);const rb=Math.min(0.045,(t-b)*0.2);const rt=Math.min(rtB(x),(t-b)*0.42,w*0.4);
  const cy=t-rt,by=b+rb;return {x,b,t,w,rb,rt,cy,by,cz:w-inset(x,cy)-rt,bz:w-inset(x,by)-rb};}
function sideZS(S,y){if(y<S.b||y>S.t)return -1;
  if(y>S.cy){const d=y-S.cy;return S.cz+Math.sqrt(Math.max(0,S.rt*S.rt-d*d));}
  if(y<S.by){const d=S.by-y;return S.bz+Math.sqrt(Math.max(0,S.rb*S.rb-d*d));}
  return S.w-inset(S.x,y);}
function topYS(S,az){if(az<=S.cz)return S.t+crown(S.x,az,S.cz);const d=az-S.cz;if(d>S.rt)return -1;return S.cy+Math.sqrt(S.rt*S.rt-d*d);}
const sideZ=(x,y)=>sideZS(sec(x),y);
const topY=(x,z)=>topYS(sec(x),Math.abs(z));
function inside(x,y,az){const S=sec(x);if(y<S.b)return false;const t=topYS(S,az);if(t<0||y>t)return false;return y>S.cy?true:az<=sideZS(S,y);}
function frontX(y,az){let lo=2.20,hi=XF+1e-4;if(!inside(lo,y,az))return lo;for(let i=0;i<26;i++){const m=(lo+hi)/2;if(inside(m,y,az))lo=m;else hi=m;}return lo;}
function rearX(y,az){let lo=-2.10,hi=XR-1e-4;if(!inside(lo,y,az))return lo;for(let i=0;i<26;i++){const m=(lo+hi)/2;if(inside(m,y,az))lo=m;else hi=m;}return lo;}

// ---------- Renderer, Szene ----------
const view=$('view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,200);

// Studio-Umgebung: Kuppel mit Lichtbändern, vorgefiltert für raue/glatte Spiegelungen
scene.environment=(function(){
  const s=new THREE.Scene();
  const dome=new THREE.SphereGeometry(40,64,32),p=dome.attributes.position,c=[];
  for(let i=0;i<p.count;i++){const y=p.getY(i)/40;let v;
    if(y<0)v=0.30+0.55*ss(-0.10,0,y);else v=0.85-0.30*ss(0,0.9,y);
    c.push(v,v,v*1.02);}
  dome.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  s.add(new THREE.Mesh(dome,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  function box(w,h,x,y,z,k){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m);}
  box(16,6,0,22,0,5);            // Deckenlicht
  box(36,1.6,0,6,-26,4);box(36,1.6,0,6,26,4); // lange Seitenstreifen
  box(36,0.8,0,13,-24,2.5);box(36,0.8,0,13,24,2.5);
  box(3,12,28,7,0,4);box(12,12,-28,7,0,5);
  box(8,8,18,12,18,1.6);
  const pm=new THREE.PMREMGenerator(renderer);const t=pm.fromScene(s,0.015).texture;pm.dispose();return t;
})();
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(1.2,12,2.4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4.5,right:4.5,top:4.5,bottom:-4.5,near:1,far:30});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.025;sun.shadow.radius=5;
scene.add(sun);
const van=new THREE.Group();scene.add(van);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.10}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ---------- Materialien ----------
function noiseCanvas(n,fn){const c=mk(n,n),g=c.getContext('2d'),im=g.createImageData(n,n);for(let i=0;i<n*n;i++){const v=fn(i);im.data[i*4]=v[0];im.data[i*4+1]=v[1];im.data[i*4+2]=v[2];im.data[i*4+3]=255;}g.putImageData(im,0,0);return c;}
const flakeTex=new THREE.CanvasTexture(noiseCanvas(256,()=>[128+(Math.random()-.5)*90,128+(Math.random()-.5)*90,255]));flakeTex.wrapS=flakeTex.wrapT=THREE.RepeatWrapping;flakeTex.repeat.set(60,60);
const grainTex=new THREE.CanvasTexture(noiseCanvas(256,()=>{const v=110+Math.random()*40;return [v,v,v];}));grainTex.wrapS=grainTex.wrapT=THREE.RepeatWrapping;grainTex.repeat.set(30,30);
const paint=new THREE.MeshPhysicalMaterial({color:SCH.white.body,metalness:0,roughness:.28,clearcoat:1,clearcoatRoughness:.035});
const under=new THREE.MeshStandardMaterial({color:0x121314,roughness:.9});
const plastic=new THREE.MeshStandardMaterial({color:0x1d1e20,roughness:.72,bumpMap:grainTex,bumpScale:.6});
const gloss=new THREE.MeshPhysicalMaterial({color:0x0c0d0e,roughness:.3,clearcoat:1,clearcoatRoughness:.06});
const gapM=new THREE.MeshBasicMaterial({color:0x2a2b2d,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3});
const rubber=new THREE.MeshStandardMaterial({color:0x161617,roughness:.88});
const alloy=new THREE.MeshPhysicalMaterial({color:0xc4c8cd,metalness:.9,roughness:.28,clearcoat:.7,clearcoatRoughness:.08});
const darkMetal=new THREE.MeshStandardMaterial({color:0x2a2c2f,metalness:.6,roughness:.5});
const discM=new THREE.MeshStandardMaterial({color:0x8d9094,metalness:1,roughness:.42});
const chrome=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.04});
function applyPaint(){const c=SCH[scheme];paint.color.setHex(c.body);paint.metalness=c.metal;paint.roughness=c.rough;
  paint.normalMap=c.flake?flakeTex:null;paint.normalScale.set(.18,.18);paint.needsUpdate=true;}

// ---------- Hilfen ----------
function finish(geo,out,off){geo.computeVertexNormals();
  const n=geo.attributes.normal,ix=geo.index.array;let sx=0,sy=0,sz=0;for(let i=0;i<n.count;i++){sx+=n.getX(i);sy+=n.getY(i);sz+=n.getZ(i);}

  g.fillStyle=bodyCss;g.strokeStyle=ln;g.lineWidth=3;g.beginPath();g.rect(fx+0.1*S,fy,bw-0.2*S,1.5*S);g.fill();g.stroke();
  g.fillStyle=glassCss;g.beginPath();g.moveTo(fx+0.3*S,fy+0.12*S);g.lineTo(fx+bw-0.3*S,fy+0.12*S);g.lineTo(fx+bw-0.2*S,fy+0.62*S);g.lineTo(fx+0.2*S,fy+0.62*S);g.closePath();g.fill();
  g.save();g.translate(fx+bw/2,fy+0.88*S);g.scale(1,0.42);g.drawImage(hoodC,-0.3*S,-0.3*S,0.6*S,0.6*S);g.restore();
  g.fillStyle='#0b0c0e';g.fillRect(fx+0.1*S,fy+0.98*S,bw-0.2*S,0.17*S);g.fillStyle='#dfe6ee';[0,1].forEach(i=>g.fillRect(fx+(i?bw-0.55*S:0.15*S),fy+1.03*S,0.40*S,0.07*S));
  g.fillStyle=bumpCss;g.fillRect(fx,fy+1.28*S,bw,0.3*S);g.fillStyle='#050506';g.fillRect(fx+bw/2-0.5*S,fy+1.32*S,1.0*S,0.2*S);
  g.fillStyle=bumpCss;g.fillRect(fx,fy+1.3*S,bw,0.3*S);
  const tx=1060,ty=700,tl2=(XMAX-XMIN)*S,tw=1.92*S;
  g.fillStyle='#8a8a8a';g.fillText('Dach / Haube',tx,ty-14);
  g.fillStyle=bodyCss;g.strokeStyle=ln;g.lineWidth=3;g.beginPath();g.rect(tx,ty,tl2,tw);g.fill();g.stroke();
  g.fillStyle=glassCss;const wx=tx+(XMAX-1.60)*S;g.fillRect(wx,ty+0.15*S,(1.60-1.02)*S,tw-0.3*S);
  g.save();g.translate(tx+(XMAX-2.0)*S,ty+tw/2);g.rotate(Math.PI/2);g.drawImage(hoodC,-0.28*S,-0.28*S,0.56*S,0.56*S);g.restore();
  g.fillStyle='#8a8a8a';g.font="300 26px 'Outfit',Arial,sans-serif";
  g.fillText('Schematische Skizze, kein Folierer-Maß. Fahrzeug: Länge ca. 5,31 m, Breite ca. 1,92 m, Höhe ca. 1,90 m, Radstand 3,28 m (Opel Vivaro L als Annahme).',60,1240);
}

// ---------- Kamera ----------
let yaw=0.8,pitch=0.14,vy=0,vp=0,drag=false,lx=0,ly=0,anim=null,dist=11,tDist=11,userZoom=false;
const target=new THREE.Vector3(0,0.9,0);
function fitDist(){const a=camera.aspect;return a<1?Math.min(15,7.8/a):10.8;}
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(!userZoom){tDist=fitDist();}}
window.addEventListener('resize',resize);resize();dist=tDist;
const pts=new Map();let pinch0=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){drag=true;lx=e.clientX;ly=e.clientY;vy=vp=0;anim=null;}
  if(pts.size===2){const a=[...pts.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
view.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch0){userZoom=true;tDist=Math.min(15,Math.max(4.5,tDist*pinch0/d));dist=tDist;}pinch0=d;return;}
  if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  vy=-dx*0.008;vp=dy*0.005;yaw+=vy;pitch=Math.max(0.02,Math.min(1.45,pitch+vp));});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch0=0;if(pts.size===0)drag=false;}
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();userZoom=true;tDist=Math.min(15,Math.max(4.5,tDist*(1+e.deltaY*0.001)));},{passive:false});
function go(ty,tp){anim={t:0,y0:yaw,p0:pitch,ty,tp};vy=vp=0;}
const ease=t=>1-Math.pow(1-t,3);
$('vSide').onclick=()=>go(0,0.06);
$('vRear').onclick=()=>go(-Math.PI/2,0.1);
$('vFront').onclick=()=>go(Math.PI/2,0.1);
$('vTop').onclick=()=>go(0.6,1.4);
$('cWhite').onclick=()=>applyScheme('white');
$('cAnth').onclick=()=>applyScheme('anth');
function setMode(m){const is3d=m==='3d';view.style.display=is3d?'block':'none';$('flat').style.display=is3d?'none':'block';$('bar3d').style.display=is3d?'flex':'none';
  $('m3d').classList.toggle('act',is3d);$('m2d').classList.toggle('act',!is3d);if(is3d)resize();else draw2D();}
$('m3d').onclick=()=>setMode('3d');$('m2d').onclick=()=>setMode('2d');
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load("96px 'Michroma'"),document.fonts.load("300 46px 'Outfit'"),document.fonts.load("500 54px 'Outfit'")]).then(()=>{drawAll();ALLTEX().forEach(t=>t.needsUpdate=true);draw2D();}).catch(()=>{});}
draw2D();
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(anim){anim.t=Math.min(1,anim.t+dt/0.9);const k=ease(anim.t);let d=anim.ty-anim.y0;d=Math.atan2(Math.sin(d),Math.cos(d));yaw=anim.y0+d*k;pitch=anim.p0+(anim.tp-anim.p0)*k;if(anim.t>=1)anim=null;}
  else if(!drag){yaw+=vy;pitch=Math.max(0.02,Math.min(1.45,pitch+vp));vy*=0.94;vp*=0.94;if(Math.abs(vy)<1e-4)vy=0;if(Math.abs(vp)<1e-4)vp=0;}
  dist+=(tDist-dist)*0.12;
  camera.position.set(target.x+dist*Math.cos(pitch)*Math.sin(yaw),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(target);
  if(view.style.display!=='none')renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
$('load').style.display='none';window.__vanOK=true;
requestAnimationFrame(tick);
window.__scheme=applyScheme;window.__setView=(y,p,d)=>{yaw=y;pitch=p;if(d){tDist=dist=d;userZoom=true;}anim=null;vy=vp=0;};
</script>
